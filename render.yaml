services:
  - type: web
    name: csir-cdss-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && pip install pydantic-settings sqlalchemy"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        value: sqlite:///./cdss_local.db
    healthCheckPath: /api/v1/health
